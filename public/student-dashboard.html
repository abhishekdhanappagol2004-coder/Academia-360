<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - SARMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">Welcome, Student!</div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active" data-page="dashboard">
                        <span class="nav-icon">🏠</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="profile">
                        <span class="nav-icon">👤</span>
                        <span>My Profile</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="academic-records">
                        <span class="nav-icon">📄</span>
                        <span>Academic Records</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="downloads">
                        <span class="nav-icon">⬇️</span>
                        <span>Download Marksheets</span>
                    </a>
                </li>
            </ul>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="main-content">
            <!-- Dashboard Page -->
            <div id="dashboard-page" class="page-content active">
                <div class="page-header">
                    <div class="page-title">
                        <span>⭐</span>
                        YOUR COMPLETE ACADEMIC RECORD
                    </div>
                    <div class="page-subtitle">One-stop access from 10th to your latest degree.</div>
                </div>
                
                <div class="academic-timeline" id="academic-timeline">
                    <!-- Academic records will be loaded here -->
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title" style="color: #9C27B0;">ATTENDANCE SUMMARY</div>
                        </div>
                        <div class="attendance-summary">
                            <div class="attendance-circle">
                                <div class="attendance-percentage" id="overall-attendance">78%</div>
                            </div>
                            <p style="font-weight: bold; color: #666;">Overall Attendance</p>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title" style="color: #4CAF50;">PERFORMANCE TREND</div>
                        </div>
                        <div class="performance-chart" id="performance-chart">
                            <!-- Chart will be generated here -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Profile Page -->
            <div id="profile-page" class="page-content">
                <div class="page-header">
                    <div class="page-title">My Profile</div>
                </div>
                <div class="card">
                    <div id="profile-content">
                        <!-- Profile information will be loaded here -->
                    </div>
                </div>
            </div>
            
            <!-- Academic Records Page -->
            <div id="academic-records-page" class="page-content">
                <div class="page-header">
                    <div class="page-title">Academic Records</div>
                </div>
                <div id="academic-records-content">
                    <!-- Detailed academic records will be loaded here -->
                </div>
            </div>
            
            <!-- Downloads Page -->
            <div id="downloads-page" class="page-content">
                <div class="page-header">
                    <div class="page-title">Download Marks & Attendance</div>
                </div>
                <div class="card">
                    <div id="downloads-content">
                        <!-- Download options will be shown here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/student-dashboard.js"></script>
</body>
</html>
